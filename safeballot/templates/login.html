#  It manages routes for logging in different user roles (admin, auditor, voter), creating elections, viewing current elections, managing voter registration, and handling sessions for users.

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <script>
        function showFields(role) {
            document.getElementById('adminFields').style.display = (role === 'admin') ? 'block' : 'none';
            document.getElementById('auditorFields').style.display = (role === 'auditor') ? 'block' : 'none';
            document.getElementById('voterFields').style.display = (role === 'voter') ? 'block' : 'none';
        }
    </script>
</head>
<body>
    {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
            <div class="flash-message">
                <p>
                    {% for category, message in messages %}
                        <p class="{{ category }}">{{ message }}</p>
                    {% endfor %}
                </p>
            </div>
        {% endif %}
    {% endwith %}
    <h1>Login</h1>

    <form method="POST" action="{{ url_for('login') }}">
        <label for="role">Role:</label>
        <select name="role" id="role" required onchange="showFields(this.value)">
            <option value="">Select a role</option>
            <option value="admin">Admin</option>
            <option value="auditor">Auditor</option>
            <option value="voter">Voter</option>
        </select><br>

        <!-- Admin-specific fields -->
        <div id="adminFields" style="display: none;">
            <label for="user_id">Admin ID:</label>
            <input type="text" id="user_id" name="user_id"><br>
        </div>

        <!-- Auditor-specific fields -->
        <div id="auditorFields" style="display: none;">
            <label for="u_id">Auditor ID:</label>
            <input type="text" id="u_id" name="u_id"><br>
        </div>

        <!-- Voter-specific fields -->
        <div id="voterFields" style="display: none;">
            <label for="ssn">SSN:</label>
            <input type="text" id="ssn" name="ssn" placeholder="XXX-XX-XXXX"><br>

            <label for="zipcode">Zipcode:</label>
            <input type="text" id="zipcode" name="zipcode" placeholder="XXXXX"><br>

            <label for="driver_id">Driver ID:</label>
            <input type="text" id="driver_id" name="driver_id" placeholder="DXXXXXXX"><br>
        </div>

        <input type="submit" value="Login">
    </form>

</body>
</html>
