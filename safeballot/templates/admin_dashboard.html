<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard</title>
</head>
<body>
    <h1>Welcome, Admin</h1>
    <h2>Admin Actions</h2>
    
    <!-- Election creation form -->
    <form method="POST" action="/create_election">
        <h3>Create Election</h3>
        <label for="name">Election Name:</label>
        <input type="text" id="name" name="name" required><br>

        <label for="date">Election Date:</label>
        <input type="date" id="date" name="date" required><br>

        <label for="candidates">Candidates (separate names with commas):</label>
        <input type="text" id="candidates" name="candidates" required><br>

        <input type="submit" value="Create Election">
    </form>

    <!-- Link to View Elections -->
    <h3>Options</h3>
    <p><a href="{{ url_for('view_elections') }}">View Current Elections</a></p> <!-- Link to view elections -->
    <p><a href="{{ url_for('logout') }}">Logout</a></p> <!-- Link to logout -->

</body>
</html>
