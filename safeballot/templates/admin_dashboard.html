<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard</title>
    <script>
        function confirmElectionCreation(event) {
    
            // Validate that at least 2 candidates are filled out
            const candidateInputs = [
                document.getElementById("candidate1").value,
                document.getElementById("candidate2").value,
                document.getElementById("candidate3").value,
                document.getElementById("candidate4").value
            ];
            const filledCandidates = candidateInputs.filter(name => name.trim() !== "");
    
            if (filledCandidates.length < 2) {
                alert("Please enter at least 2 candidates.");
                return;
            }
        }
    </script>
    
</head>
<body>
    <h1>Welcome, {{ admin_name }}!</h1>

    <!-- Display flash messages -->
    {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
            <ul>
            {% for category, message in messages %}
                <li class="{{ category }}">{{ message }}</li>
            {% endfor %}
            </ul>
        {% endif %}
    {% endwith %}

    <!-- Election creation form -->
    <form method="POST" action="/admin_dashboard" onsubmit="confirmElectionCreation(event)">
        <h3>Create Election</h3>
        <label for="name">Election Name:</label>
        <input type="text" id="name" name="name" required><br>
    
        <label for="date">Election Date:</label>
        <input type="date" id="date" name="date" required><br>
    
        <label>Candidate 1:</label>
        <input type="text" id="candidate1" name="candidate1" required><br>
    
        <label>Candidate 2:</label>
        <input type="text" id="candidate2" name="candidate2" required><br>
    
        <label>Candidate 3 (optional):</label>
        <input type="text" id="candidate3" name="candidate3"><br>
    
        <label>Candidate 4 (optional):</label>
        <input type="text" id="candidate4" name="candidate4"><br>
    
        <input type="submit" value="Create Election">
    </form>

    <!-- Link to View Elections -->
    <p><a href="{{ url_for('view_elections') }}">View Current Elections</a></p>
    <p><a href="{{ url_for('logout') }}">Logout</a></p>
</body>
</html>
