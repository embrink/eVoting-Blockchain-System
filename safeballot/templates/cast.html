<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ election_title }}</title>
</head>
<body>
    <h1>{{ election_title }}</h1>

    <form action="{{ url_for('submit_vote', election_id=election_id) }}" method="POST">
        {% for candidate in candidates %}
            <label>
                <input type="radio" name="candidate" value="{{ candidate }}" required>
                {{ candidate }}
            </label><br>
        {% endfor %}
        <button type="submit">Submit Vote</button>
    </form>

    <p><a href="{{ url_for('view_elections_voter') }}">Back to Elections</a></p>
</body>
</html>
