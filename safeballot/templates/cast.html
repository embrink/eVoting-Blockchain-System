Authors: Ella Brink, Lauren Wilson, Emma Bellai, Lucy DiSalvo 
Version History:
- Version 1.0 (Sprint 4): Initial version created to replace cast_vote_election by Ella Brink
-->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <title>{{ election_title }}</title>
</head>
<body>
    <div class="header">
        <a href="index.html"><img class="logo" src="{{ url_for('static', filename='images/Safeballot (500 x 384 px).png') }}"></a>
            <div class="dropdown" style="float:right">
                <a href="#" class="nav">
                    <div class="one"></div>
                    <div class="two"></div>
                    <div class="three"></div>
                </a>
            <div class="dropdown-content" style="right: 27px;">
                <a href="/index">Home</a>
                <a href="/login">Login</a>
                <a href="/signup">Sign Up</a>
            </div>
            </div>
    </div>

    <form action="{{ url_for('cast', election_id=election_id) }}" method="POST"> 
        {% for candidate in candidates %}
            <label>
                <input type="radio" name="candidate_id" value="{{ candidate[0] }}" required>
                {{ candidate[1] }}
            </label><br>
        {% endfor %}
        <button type="submit">Submit Vote</button>
    </form>
<p><a href="{{ url_for('view_elections_voter') }}">Back to Elections</a></p>
</body>
</html>
