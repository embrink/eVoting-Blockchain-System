<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Election Statistics</title>
</head>
<body>
    <h1>Election Statistics for {{ election.name }}</h1>
    <table>
        <tr>
            <th>Candidate</th>
            <th>Total Votes</th>
        </tr>
        {% for candidate in candidates %}
            <tr>
                <td>{{ candidate[0] }}</td>
                <td>{{ candidate[1] }}</td>
            </tr>
        {% endfor %}
    </table>
    <p><a href="{{ url_for('view_elections_auditor') }}">Back to Elections</a></p>
</body>
</html>
