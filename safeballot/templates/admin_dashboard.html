- Version 1.0 (Sprint 2): Initial version created by Ella Brink

- Version 1.2 (Sprint 4): Added Candidate View by Ella Brink
- Version 1.3 (Sprint 4): Added election created message by Ella Brink
- Version 1.4 (Sprint 4): Specified format for candidate inputs by Lauren Wilson
- Version 1.5 (Sprint 4): Throws error when candidates don't match specified format by Lauren Wilson

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <title>Admin Dashboard</title>
    <script>
        function confirmElectionCreation(event) {
    
            // Validate that at least 2 candidates are filled out
            const candidateInputs = [
                document.getElementById("candidate1").value,
                document.getElementById("candidate2").value,
                document.getElementById("candidate3").value,
                document.getElementById("candidate4").value
            ];
            const filledCandidates = candidateInputs.filter(name => name.trim() !== "");
    
            if (filledCandidates.length < 2) {
                alert("Please enter at least 2 candidates.");
                return;
            }
        }
    </script>
    
    <style>
        /* Popup message styling */
        .popup {
            display: none;
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background-color: white;
            padding: 20px;
            box-shadow: 0px 0px 10px rgba(0, 0, 0, 0.5);
            border-radius: 8px;
            z-index: 1000;
        }
        .popup.active {
            display: block;
        }
        .overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            z-index: 999;
        }
        .overlay.active {
            display: block;
        }
        .close-btn {
            margin-top: 10px;
            padding: 5px 10px;
            background-color: #007BFF;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <div class="header">
        <a href="index.html"><img class="logo" src="{{ url_for('static', filename='images/Safeballot (500 x 384 px).png') }}"></a>
            <div class="dropdown" style="float:right">
                <a href="#" class="nav">
                    <div class="one"></div>
                    <div class="two"></div>
                    <div class="three"></div>
                </a>
            <div class="dropdown-content" style="right: 27px;">
                <a href="/index">Home</a>
                <a href="/login">Login</a>
                <a href="/signup">Sign Up</a>
            </div>
            </div>
    </div>
    <h1>Welcome, {{ admin_name }}!</h1>


    <!-- Display flash messages -->
    {% with messages = get_flashed_messages(with_categories=true) %}
      {% if messages %}
        <div class="overlay active"></div>
        <div class="popup active">
            <div class="flashes">
                {% for category, message in messages %}
                    <p class="{{ category }}">{{ message }}</p>
                {% endfor %}
            </div>
            <!-- Add a button to redirect to view elections -->
            <form action="{{ url_for('view_elections') }}" method="get">
                <button type="submit" class="close-btn">OK</button>
            </form>
        </div>
      {% endif %}
    {% endwith %}

    <!-- Election creation form -->
    <form method="POST" action="/admin_dashboard" onsubmit="confirmElectionCreation(event)">
        <h3>Create Election</h3>
        <label for="name">Election Name:</label>
        <input type="text" id="name" name="name" required><br>
    
        <label for="date">Election Date:</label>
        <input type="date" id="date" name="date" required><br>
    
        <label>Candidate 1:</label>
        <input type="text" id="candidate1" name="candidate1" placeholder="FirstName LastName" pattern="^[A-Z][a-z]+ [A-Z][a-z]+$" required><br>
    
        <label>Candidate 2:</label>
        <input type="text" id="candidate2" name="candidate2" placeholder="FirstName LastName" pattern="^[A-Z][a-z]+ [A-Z][a-z]+$" required><br>
    
        <label>Candidate 3 (optional):</label>
        <input type="text" id="candidate3" name="candidate3" placeholder="FirstName LastName" pattern="^[A-Z][a-z]+ [A-Z][a-z]+$"><br>
    
        <label>Candidate 4 (optional):</label>
        <input type="text" id="candidate4" name="candidate4" placeholder="FirstName LastName" pattern="^[A-Z][a-z]+ [A-Z][a-z]+$"><br>
    
        <input type="submit" value="Create Election">
    </form>

    <!-- Link to View Elections -->
    <p><a href="{{ url_for('view_elections') }}">View Current Elections</a></p>
    <p><a href="{{ url_for('logout') }}">Logout</a></p>
</body>
</html>
