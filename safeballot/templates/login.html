<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <script>
        function showFields(role) {
            document.getElementById('adminFields').style.display = (role === 'admin') ? 'block' : 'none';
            document.getElementById('auditorFields').style.display = (role === 'auditor') ? 'block' : 'none';
            document.getElementById('voterFields').style.display = (role === 'voter') ? 'block' : 'none';
        }
    </script>

    <style>
        /* Popup message styling */
        .popup {
            display: none;
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background-color: white;
            padding: 20px;
            box-shadow: 0px 0px 10px rgba(0, 0, 0, 0.5);
            border-radius: 8px;
            z-index: 1000;
        }
        .popup.active {
            display: block;
        }
        .overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            z-index: 999;
        }
        .overlay.active {
            display: block;
        }
        .close-btn {
            margin-top: 10px;
            padding: 5px 10px;
            background-color: #007BFF;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }
    </style>
</head>

<body>
    <h1>Login</h1>

    <form method="POST" action="{{ url_for('login') }}">
        <label for="role">Role:</label>
        <select name="role" id="role" required onchange="showFields(this.value)">
            <option value="">Select a role</option>
            <option value="admin">Admin</option>
            <option value="auditor">Auditor</option>
            <option value="voter">Voter</option>
        </select><br>

        <!-- Admin-specific fields -->
        <div id="adminFields" style="display: none;">
            <label for="user_id">Admin ID:</label>
            <input type="text" id="user_id" name="user_id" required><br>
        </div>

        <!-- Auditor-specific fields -->
        <div id="auditorFields" style="display: none;">
            <label for="u_id">Auditor ID:</label>
            <input type="text" id="u_id" name="u_id" required><br>
        </div>

        <!-- Voter-specific fields -->
        <div id="voterFields" style="display: none;">
            <label for="ssn">SSN:</label>
            <input type="text" id="ssn" name="ssn" placeholder="XXX-XX-XXXX" required><br>

            <label for="zipcode">Zipcode:</label>
            <input type="text" id="zipcode" name="zipcode" placeholder="XXXXX" required><br>

            <label for="driver_id">Driver ID:</label>
            <input type="text" id="driver_id" name="driver_id" placeholder="DXXXXXXX" required><br>
        </div>

        <input type="submit" value="Login">
    </form>

    {% with messages = get_flashed_messages(with_categories=true) %}
    {% if messages %}
        <div class="overlay active"></div>
        <div class="popup active">
            {% for category, message in messages %}
                <p>{{ message }}</p>
            {% endfor %}
            <form method="GET" action="/login">
                <button type="submit" class="close-btn">OK</button>
            </form>
        </div>
    {% endif %}
    {% endwith %}

</body>
</html>
